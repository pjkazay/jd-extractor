<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JD Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #ffffff;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #0f172a;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: #475569; }

    /* ── Checklist ── */
    .checklist {
      list-style: none;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .checklist li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #475569;
    }

    .check-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
    }

    .check-dot.pass {
      background: #dcfce7;
      color: #16a34a;
    }

    .check-dot.fail {
      background: #fee2e2;
      color: #dc2626;
    }

    .check-dot.pending {
      background: #f1f5f9;
      color: #94a3b8;
    }

    /* ── Extract button ── */
    #extract-btn {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
    }

    #extract-btn.active {
      background: #22c55e;
      color: #fff;
    }
    #extract-btn.active:hover { background: #16a34a; }
    #extract-btn.active:active { transform: scale(0.98); }

    #extract-btn.inactive {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #extract-btn.loading {
      background: #86efac;
      color: #fff;
      cursor: not-allowed;
    }

    /* ── Status message ── */
    #status-msg {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
      text-align: center;
      border-radius: 5px;
      padding: 0 4px;
    }

    #status-msg.success { color: #16a34a; }
    #status-msg.error   { color: #dc2626; }
    #status-msg.info    { color: #6366f1; }
  </style>
</head>
<body>
  <div class="header">
    <h1>JD Extractor</h1>
    <button class="settings-btn" id="settings-btn" title="Settings">⚙</button>
  </div>

  <ul class="checklist" id="checklist">
    <li>
      <span class="check-dot pending" id="dot-url">–</span>
      <span id="label-url">LinkedIn job view URL</span>
    </li>
    <li>
      <span class="check-dot pending" id="dot-box">–</span>
      <span id="label-box">Job description found</span>
    </li>
    <li>
      <span class="check-dot pending" id="dot-exp">–</span>
      <span id="label-exp">Description expanded</span>
    </li>
  </ul>

  <button id="extract-btn" class="inactive" disabled>Extract &amp; Copy to Clipboard</button>
  <div id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
